{% extends 'base.html' %}
{% block title %}Edit Student - EduMetrics Admin{% endblock %}

{% block content %}
<div class="row justify-content-center animate-fadeInUp">
    <div class="col-lg-8">
        <div class="d-flex align-items-center mb-4">
            <a href="{{ url_for('admin.students') }}" class="btn btn-sm btn-outline-secondary me-3">
                <i class="fas fa-arrow-left"></i>
            </a>
            <div>
                <h4 class="fw-bold mb-0 text-danger"><i class="fas fa-user-edit me-2"></i>Edit Student Profile (Admin Mode)</h4>
                <p class="text-muted small mb-0">Administrator editing permissions for {{ student.full_name }}</p>
            </div>
        </div>

        <div class="form-card">
            <form method="post">
                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label">Roll Number * <span class="badge bg-danger">Admin Editable</span></label>
                        <input type="text" class="form-control" name="roll_number" required value="{{ student.roll_number }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Full Name *</label>
                        <input type="text" class="form-control" name="full_name" required value="{{ student.full_name }}">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">CGPA (0 - 10)</label>
                        <input type="number" step="0.01" min="0" max="10" class="form-control fw-bold text-primary"
                               name="entered_cgpa" value="{{ student.entered_cgpa if student.entered_cgpa is not none else '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Course</label>
                        <input type="text" class="form-control" name="course" value="{{ student.course or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Branch</label>
                        <input type="text" class="form-control" name="branch" value="{{ student.branch or '' }}">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Department</label>
                        <input type="text" class="form-control" name="department" value="{{ student.department or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Semester</label>
                        <input type="text" class="form-control" name="semester" value="{{ student.semester or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Class</label>
                        <input type="text" class="form-control" name="class_name" value="{{ student.class_name or '' }}">
                    </div>
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-4">
                        <label class="form-label">Age</label>
                        <input type="number" class="form-control" name="age" value="{{ student.age or '' }}">
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Gender</label>
                        <select class="form-select" name="gender">
                            <option value="">-- Select --</option>
                            <option value="Male" {% if student.gender == 'Male' %}selected{% endif %}>Male</option>
                            <option value="Female" {% if student.gender == 'Female' %}selected{% endif %}>Female</option>
                            <option value="Other" {% if student.gender == 'Other' %}selected{% endif %}>Other</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Graduation Year</label>
                        <input type="number" class="form-control" name="graduation_year" value="{{ student.graduation_year or '' }}">
                    </div>
                </div>

                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label class="form-label">Mobile Number</label>
                        <input type="text" class="form-control" name="mobile_number" value="{{ student.mobile_number or '' }}">
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" value="{{ student.email or '' }}">
                    </div>
                </div>

                <div class="d-flex justify-content-between">
                    <a href="{{ url_for('admin.students') }}" class="btn btn-outline-secondary">Cancel</a>
                    <button type="submit" class="btn btn-danger px-4">
                        <i class="fas fa-save me-2"></i>Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
